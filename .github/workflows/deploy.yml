# PanEx · pubblicazione automatica su GitHub Pages
# A ogni push su "main" GitHub costruisce la versione web (npx expo export -p web) e la pubblica.
# Prima di usarlo:
#  1. Settings -> Pages -> Source: "GitHub Actions"
#  2. Settings -> Secrets and variables -> Actions -> scheda "Variables":
#       EXPO_PUBLIC_SUPABASE_URL
#       EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#     (sono valori pubblici per natura: la protezione sono le regole RLS; MAI la chiave service_role)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # permette di lanciarlo a mano dalla scheda Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # stessa linea di Node che usi in locale (controlla con: node -v)
          cache: npm

      - run: npm ci

      - name: Build web
        run: npx expo export -p web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Evita che Jekyll ignori la cartella _expo
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
